[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polygraphpy"
version = "0.1.0"
authors = [
    { name = "João Gabriel Duarte", email = "dacos033@umn.edu" },
]
description = "A package for polymer graph-based property prediction and generative design."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "torch>=2.8.0",
    "torch-geometric>=2.6.1",
    "torch-cluster>=1.6.3",
    "torch-scatter>=2.1.2",
    "torch-sparse>=0.6.18",
    "torch-spline-conv>=1.2.2",
    "scikit-learn>=1.7.1",
    "selfies>=2.2.0",
    "stk>=2025.7.17.0",
    "transformers>=4.55.0",
]

[project.urls]
Homepage = "https://github.com/SASP-lab/PolyGraphPy"

[tool.setuptools]
packages = { find = { where = ["."] } }
package-data = { "polygraphpy" = ["3ob-3-1/*"] }