[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polygraphpy"
version = "0.1.0"
authors = [
    { name = "João Gabriel Duarte", email = "dacos033@umn.edu" },
]
description = "A package for polymer graph-based property prediction and generative design."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "torch>=2.8.0",
    "torch-geometric>=2.6.1",
    "scikit-learn>=1.7.1",
    "selfies>=2.2.0",
    "stk>=2024.10.2.0",
    "transformers>=4.55.0",
    "click>=8.2.1"
    "joblib>=1.5.1"
    "matplotlib>=3.10.5"
    "numpy>=2.3.2
    "pandas=>2.3.1"
    "rdkit>=2025.3.3"
    "tqdm>=4.67.1"
]

[project.urls]
Homepage = "https://github.com/SASP-lab/PolyGraphPy"

[tool.setuptools]
packages = { find = { where = ["."] } }
package-data = { "polygraphpy" = ["3ob-3-1/*"] }